name: CORE engine and gRPC tests
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-server-dev.txt
      - run: pip install -r requirements-server-dev.txt
      - name: Verify generated wire contract
        run: |
          python scripts/generate_contracts.py
          git diff --exit-code -- archreactor
      - run: pytest -q
